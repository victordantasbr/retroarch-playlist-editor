<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RetroArch Playlist Editor — Fuzzy Thumbnail Match</title>
  <style>
    :root{--bg:#0f1720;--card:#111827;--muted:#9ca3af;--accent:#06b6d4}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#071126 0%,#0b1220 100%);color:#e6eef6}
    .wrap{max-width:980px;margin:32px auto;padding:20px;background:rgba(255,255,255,0.02);border-radius:10px}
    h1{margin:0 0 12px;font-size:20px}
    .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    input[type=file]{color:var(--muted)}
    select,button,input[type=range]{background:var(--card);border:1px solid rgba(255,255,255,0.04);color:inherit;padding:8px;border-radius:6px}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    .resizable-table{table-layout:fixed}
    th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.03);text-align:left;font-size:13px;overflow:hidden;text-overflow:ellipsis}
    th{position:relative}
    .resize-handle{position:absolute;right:0;top:0;bottom:0;width:4px;background:transparent;cursor:col-resize;transition:background 0.2s}
    .resize-handle:hover{background:var(--accent)}
    tr.green{background:rgba(16,185,129,0.07)}
    tr.yellow{background:rgba(234,179,8,0.05)}
    tr.red{background:rgba(239,68,68,0.04)}
    .small{font-size:12px;color:var(--muted)}
    .row-actions button{margin-right:6px}
    .footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
    .note{color:var(--muted);font-size:13px}
    input[type=text]{width:100%;background:transparent;border:0;color:inherit}
  </style>
</head>
<body>
    <script type="module" src="app-vue.js"></script>
    <div id="app" class="wrap"></div>
</body>
</html>
